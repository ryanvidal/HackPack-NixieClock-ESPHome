name: ESPHome CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ESPHome
        run: |
          pip install esphome

      - name: Create mock secrets for CI
        run: |
          cat << 'EOF' > examples/secrets.yaml
          wifi_ssid: "MockWiFiSSID"
          wifi_password: "MockPassword123"
          EOF

      - name: Compile Basic Example
        run: |
          esphome compile examples/nixie_clock_basic.yaml

      - name: Compile Advanced Example
        run: |
          esphome compile examples/nixie_clock_advanced.yaml
