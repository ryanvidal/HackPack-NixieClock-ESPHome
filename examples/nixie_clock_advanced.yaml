# ==============================================================================
# ESPHome Advanced Configuration for Hack Pack Nixie Clock
# Board: Hack Pack ESP32-C3 Mini (Box 15)
#
# This advanced example explicitly declares all sub-platform entities,
# allowing developers to customize entity names, icons, categories, or
# attach custom automations to any hardware event.
# ==============================================================================

esphome:
  name: hack-pack-nixie-clock
  friendly_name: Hack Pack Nixie Clock
  devices:
    - name: "Clock & Display"
      id: dev_clock
    - name: "Lighting"
      id: dev_lighting
    - name: "Alarm Clock"
      id: dev_alarm
    - name: "Countdown Timer"
      id: dev_timer
    - name: "Audio & Voice"
      id: dev_audio

esp32:
  variant: esp32c3
  framework:
    type: esp-idf

logger:
  level: INFO

api:
  encryption:
    key: "8i45eOZdKzZQ8YGeFdT+ilopNh075J5aBgEnZTZUeT4="
  actions:
    # --------------------------------------------------------------------------
    # Action: Display Alert & Scrolling Custom Text on Nixie Tubes
    # --------------------------------------------------------------------------
    - action: display_text
      variables:
        message: string
        scroll_speed_ms: int
      then:
        - hack_pack_nixie_clock.display_text:
            message: !lambda "return message;"
            scroll_speed_ms: !lambda "return (scroll_speed_ms > 0) ? (uint32_t)scroll_speed_ms : 350;"

    # --------------------------------------------------------------------------
    # Action: Trigger Face Animation
    # --------------------------------------------------------------------------
    - action: trigger_face_animation
      then:
        - hack_pack_nixie_clock.trigger_face_animation:

    # --------------------------------------------------------------------------
    # Action: Trigger Cathode Clean / Slot Machine Animation
    # --------------------------------------------------------------------------
    - action: trigger_slot_machine
      variables:
        duration_ms: int
      then:
        - hack_pack_nixie_clock.trigger_slot_machine:
            duration_ms: !lambda "return (duration_ms > 0) ? (uint32_t)duration_ms : 2500;"

    # --------------------------------------------------------------------------
    # Action: Play Voice Recording / Sound Beep
    # --------------------------------------------------------------------------
    - action: play_sound
      then:
        - hack_pack_nixie_clock.play_sound:

    # --------------------------------------------------------------------------
    # Action: Start Countdown Timer
    # --------------------------------------------------------------------------
    - action: start_timer
      variables:
        duration: string
      then:
        - hack_pack_nixie_clock.start_timer:
            duration: !lambda "return duration;"

ota:
  - platform: esphome
    on_begin:
      then:
        - hack_pack_nixie_clock.set_display_mode:
            mode: "OFF"
        - lambda: |-
            id(clock_hub).set_ready_for_ota();

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: Hack Pack Nixie Fallback Hotspot
    password: "IXtO3BrtHqLm"

captive_portal:

# ==============================================================================
# Time Source
# ==============================================================================
time:
  - platform: homeassistant
    id: homeassistant_time

# ==============================================================================
# External Component: Hack Pack Nixie Clock
# ==============================================================================
external_components:
  - source:
      type: local
      path: components
    components: [hack_pack_nixie_clock]

# ==============================================================================
# Hack Pack Nixie Clock Component Hub
# All pins default automatically to the Hack Pack Box 15 hardware!
# ==============================================================================
hack_pack_nixie_clock:
  id: clock_hub
  time_id: homeassistant_time

# ==============================================================================
# Native Light Entities (RGB Color Picker & Brightness Controls)
# Built-in Effects: Rainbow, Gradient, Flow, Wipe, Pulse, Bounce
# ==============================================================================
light:
  - platform: hack_pack_nixie_clock
    type: panel
    name: "Nixie Tube Lighting"
    id: light_panel
    device_id: dev_lighting
    icon: "mdi:led-strip"
    restore_mode: RESTORE_DEFAULT_ON

  - platform: hack_pack_nixie_clock
    type: underglow
    name: "Underglow Lighting"
    id: light_underglow
    device_id: dev_lighting
    icon: "mdi:wall-sconce-flat"
    restore_mode: RESTORE_DEFAULT_ON

# ==============================================================================
# Native Controls & Status Entities
# ==============================================================================
datetime:
  - platform: hack_pack_nixie_clock
    alarm_time:
      name: "Alarm Time"
      device_id: dev_alarm

text:
  - platform: hack_pack_nixie_clock
    timer_duration:
      name: "Timer Duration"
      device_id: dev_timer

number:
  - platform: hack_pack_nixie_clock
    timer_duration_minutes:
      name: "Timer Duration (Minutes)"
      device_id: dev_timer
      mode: BOX

switch:
  - platform: hack_pack_nixie_clock
    format_24hr:
      name: "24-Hour Format"
      device_id: dev_clock
    leading_zero:
      name: "Leading Zero"
      device_id: dev_clock
    colon_blinking:
      name: "Colon Blinking"
      device_id: dev_clock
    am_pm_indicators:
      name: "AM⁄PM Indicators"
      device_id: dev_clock
    periodic_faces:
      name: "Periodic Face Animations"
      device_id: dev_clock
    physical_buttons:
      name: "Physical Buttons Enabled"
      device_id: dev_clock
    link_brightness:
      name: "Link Panel & Underglow Brightness"
      device_id: dev_lighting
    alarm_enabled:
      name: "Alarm Enabled"
      device_id: dev_alarm
    record_sound:
      name: "Record Sound (Hold)"
      device_id: dev_audio

select:
  - platform: hack_pack_nixie_clock
    display_mode:
      name: "Display Mode"
      device_id: dev_clock
    colon_color_mode:
      name: "Colon Color Mode"
      device_id: dev_clock
      entity_category: config

button:
  - platform: hack_pack_nixie_clock
    start_timer:
      name: "Start Countdown Timer"
      device_id: dev_timer
    stop_timer:
      name: "Stop Countdown Timer"
      device_id: dev_timer
    stop_alarm:
      name: "Stop Ringing Alarm"
      device_id: dev_alarm
    trigger_face:
      name: "Trigger Face Animation"
      device_id: dev_clock
    trigger_slot_machine:
      name: "Cathode Cleaning (Slot Machine)"
      device_id: dev_clock
    play_sound:
      name: "Play Audio Recording"
      device_id: dev_audio

sensor:
  - platform: hack_pack_nixie_clock
    timer_remaining_seconds:
      name: "Timer Remaining Seconds"
      device_id: dev_timer

text_sensor:
  - platform: hack_pack_nixie_clock
    timer_remaining:
      name: "Timer Remaining"
      device_id: dev_timer
    active_display_chars:
      name: "Active Display Characters"
      device_id: dev_clock

binary_sensor:
  - platform: hack_pack_nixie_clock
    alarm_ringing:
      name: "Alarm Ringing"
      device_id: dev_alarm
    timer_running:
      name: "Timer Running"
      device_id: dev_timer
    timer_ringing:
      name: "Timer Ringing"
      device_id: dev_timer
