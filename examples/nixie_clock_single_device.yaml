# ==============================================================================
# ESPHome Single-Device Configuration for Hack Pack Nixie Clock
# Board: Hack Pack ESP32-C3 Mini (Box 15)
#
# This configuration imports the single-device package, unifying all clock,
# lighting, alarm, timer, and audio entities into a single Home Assistant device.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Import Single-Device Package
# ------------------------------------------------------------------------------
packages:
  # For local installations (cloned repository):
  hack_pack_nixie_clock: !include ../packages/nixie_clock_single_device.yaml

  # Or for direct remote GitHub imports:
  # hack_pack_nixie_clock:
  #   url: https://github.com/ryanvidal/HackPack-NixieClock-ESPHome
  #   ref: hack_pack_nixie_clock-v1.1.0
  #   files: [packages/nixie_clock_single_device.yaml]

# ------------------------------------------------------------------------------
# 2. External Component Location
# ------------------------------------------------------------------------------
external_components:
  - source:
      type: local
      path: ../components
    components: [hack_pack_nixie_clock]

  # Or for direct remote GitHub imports:
  # - source: github://ryanvidal/HackPack-NixieClock-ESPHome@hack_pack_nixie_clock-v1.1.0
  #   components: [hack_pack_nixie_clock]

# ------------------------------------------------------------------------------
# 3. Security & Network Credentials
# ------------------------------------------------------------------------------
api:
  encryption:
    key: !secret api_encryption_key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: Hack Pack Nixie Fallback Hotspot

captive_portal:
