# ==============================================================================
# Complete ESPHome Example: CrunchLabs Hack Pack Nixie Clock (Box 15)
# ==============================================================================

esphome:
  name: hack-pack-nixie-clock
  friendly_name: "Hack Pack Nixie Clock"
  devices:
    - name: "Clock & Display"
      id: dev_clock
    - name: "Lighting"
      id: dev_lighting
    - name: "Alarm Clock"
      id: dev_alarm
    - name: "Countdown Timer"
      id: dev_timer
    - name: "Audio & Voice"
      id: dev_audio

esp32:
  variant: esp32c3
  framework:
    type: esp-idf

logger:
  level: INFO

api:
  # encryption:
  #   key: "YOUR_32_BYTE_BASE64_KEY"
  actions:
    # --------------------------------------------------------------------------
    # Action: Display Alert & Scrolling Custom Text on Nixie Tubes
    # --------------------------------------------------------------------------
    - action: display_text
      variables:
        message: string
        scroll_speed_ms: int
      then:
        - lambda: |-
            uint32_t speed = (scroll_speed_ms > 0) ? (uint32_t)scroll_speed_ms : 350;
            id(clock_hub).show_scrolling_text(message, speed);

    # --------------------------------------------------------------------------
    # Action: Trigger Face Animation
    # --------------------------------------------------------------------------
    - action: trigger_face_animation
      then:
        - lambda: |-
            id(clock_hub).trigger_face_animation();

    # --------------------------------------------------------------------------
    # Action: Trigger Cathode Clean / Slot Machine Animation
    # --------------------------------------------------------------------------
    - action: trigger_slot_machine
      variables:
        duration_ms: int
      then:
        - lambda: |-
            uint32_t dur = (duration_ms > 0) ? (uint32_t)duration_ms : 2500;
            id(clock_hub).trigger_slot_machine(dur);

    # --------------------------------------------------------------------------
    # Action: Play Voice Recording / Sound Beep
    # --------------------------------------------------------------------------
    - action: play_sound
      then:
        - lambda: |-
            id(clock_hub).play_beep(150);

    # --------------------------------------------------------------------------
    # Action: Start Countdown Timer
    # --------------------------------------------------------------------------
    - action: start_timer
      variables:
        duration: string
      then:
        - lambda: |-
            if (!duration.empty()) {
              uint32_t s = id(clock_hub).set_timer_duration_string(duration);
              id(text_timer_duration).publish_state(duration);
              if (s > 0) {
                id(number_timer_minutes).publish_state(s / 60);
              }
            }
            id(clock_hub).start_timer();
            id(select_display_mode).publish_state("Timer");

ota:
  - platform: esphome
    on_begin:
      then:
        - lambda: |-
            id(clock_hub).set_display_mode(esphome::hack_pack_nixie_clock::MODE_OFF);
            id(clock_hub).set_panel_brightness(0);
            id(clock_hub).set_underglow_brightness(25);

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Hack Pack Nixie Fallback Hotspot"
    password: "fallback_password"

captive_portal:

# ==============================================================================
# Time Source (Syncs local time with Home Assistant)
# ==============================================================================
time:
  - platform: homeassistant
    id: homeassistant_time

# ==============================================================================
# External Component: Hack Pack Nixie Clock
# ==============================================================================
external_components:
  - source:
      type: local
      path: components
    components: [hack_pack_nixie_clock]

# ==============================================================================
# Hack Pack Nixie Clock Component Hub
# ==============================================================================
hack_pack_nixie_clock:
  id: clock_hub
  time_id: homeassistant_time

# ==============================================================================
# Native Light Entities (RGB Color Picker & Brightness Controls)
# ==============================================================================
light:
  - platform: hack_pack_nixie_clock
    type: panel
    name: "Nixie Tube Lighting"
    id: light_panel
    device_id: dev_lighting
    icon: "mdi:led-strip"
    restore_mode: RESTORE_DEFAULT_ON
    effects:
      - lambda:
          name: "Rainbow"
          update_interval: 1s
          lambda: |-
            if (initial_run) {
              id(clock_hub).set_color_mode(esphome::hack_pack_nixie_clock::COLOR_RAINBOW);
            }
      - lambda:
          name: "Gradient"
          update_interval: 1s
          lambda: |-
            if (initial_run) {
              id(clock_hub).set_color_mode(esphome::hack_pack_nixie_clock::COLOR_GRADIENT);
            }
      - lambda:
          name: "Flow"
          update_interval: 1s
          lambda: |-
            if (initial_run) {
              id(clock_hub).set_color_mode(esphome::hack_pack_nixie_clock::COLOR_FLOW);
            }
      - lambda:
          name: "Wipe"
          update_interval: 1s
          lambda: |-
            if (initial_run) {
              id(clock_hub).set_color_mode(esphome::hack_pack_nixie_clock::COLOR_WIPE);
            }
      - lambda:
          name: "Pulse"
          update_interval: 1s
          lambda: |-
            if (initial_run) {
              id(clock_hub).set_color_mode(esphome::hack_pack_nixie_clock::COLOR_PULSE);
            }
      - lambda:
          name: "Bounce"
          update_interval: 1s
          lambda: |-
            if (initial_run) {
              id(clock_hub).set_color_mode(esphome::hack_pack_nixie_clock::COLOR_BOUNCE);
            }

  - platform: hack_pack_nixie_clock
    type: underglow
    name: "Underglow Lighting"
    id: light_underglow
    device_id: dev_lighting
    icon: "mdi:wall-sconce-flat"
    restore_mode: RESTORE_DEFAULT_ON

# ==============================================================================
# Home Assistant Controls & Entities
# ==============================================================================

datetime:
  - platform: template
    type: time
    name: "Alarm Time"
    id: alarm_time_picker
    device_id: dev_alarm
    icon: "mdi:clock-edit-outline"
    initial_value: "07:00:00"
    optimistic: true
    set_action:
      - lambda: |-
          id(clock_hub).set_alarm(x.hour, x.minute);

text:
  - platform: template
    name: "Timer Duration"
    id: text_timer_duration
    device_id: dev_timer
    icon: "mdi:timer-edit-outline"
    initial_value: "5m"
    optimistic: true
    mode: text
    set_action:
      - lambda: |-
          uint32_t s = id(clock_hub).set_timer_duration_string(x);
          if (s > 0) {
            id(number_timer_minutes).publish_state(s / 60);
          }

number:
  - platform: template
    name: "Timer Duration (Minutes)"
    id: number_timer_minutes
    device_id: dev_timer
    icon: "mdi:timer-sand"
    unit_of_measurement: "min"
    min_value: 1
    max_value: 180
    step: 1
    mode: box
    initial_value: 5
    optimistic: true
    set_action:
      - lambda: |-
          char buf[16];
          snprintf(buf, sizeof(buf), "%dm", (int)x);
          id(text_timer_duration).publish_state(buf);
          id(clock_hub).set_timer_duration((uint32_t)x * 60);

switch:
  # --- Clock & Display Settings ---
  - platform: template
    name: "24-Hour Format"
    id: switch_24hr_mode
    device_id: dev_clock
    icon: "mdi:clock-time-twelve-outline"
    entity_category: config
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    turn_on_action:
      - lambda: id(clock_hub).set_24hr_mode(true);
    turn_off_action:
      - lambda: id(clock_hub).set_24hr_mode(false);

  - platform: template
    name: "Leading Zero"
    id: switch_leading_zero
    device_id: dev_clock
    icon: "mdi:numeric-0"
    entity_category: config
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    turn_on_action:
      - lambda: id(clock_hub).set_leading_zero(true);
    turn_off_action:
      - lambda: id(clock_hub).set_leading_zero(false);

  - platform: template
    name: "Colon Blinking"
    id: switch_colon_blinking
    device_id: dev_clock
    icon: "mdi:dots-vertical"
    entity_category: config
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    turn_on_action:
      - lambda: id(clock_hub).set_colon_blinking(true);
    turn_off_action:
      - lambda: id(clock_hub).set_colon_blinking(false);

  - platform: template
    name: "AM⁄PM Indicators"
    id: switch_am_pm_indicators
    device_id: dev_clock
    icon: "mdi:theme-light-dark"
    entity_category: config
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
    turn_on_action:
      - lambda: id(clock_hub).set_am_pm_indicators(true);
    turn_off_action:
      - lambda: id(clock_hub).set_am_pm_indicators(false);

  - platform: template
    name: "Periodic Face Animations"
    id: switch_face_animations
    device_id: dev_clock
    icon: "mdi:emoticon-outline"
    entity_category: config
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    turn_on_action:
      - lambda: id(clock_hub).set_face_animations(true);
    turn_off_action:
      - lambda: id(clock_hub).set_face_animations(false);

  - platform: template
    name: "Physical Buttons Enabled"
    id: switch_physical_buttons
    device_id: dev_clock
    icon: "mdi:gesture-tap-button"
    entity_category: config
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
    turn_on_action:
      - lambda: id(clock_hub).set_physical_buttons(true);
    turn_off_action:
      - lambda: id(clock_hub).set_physical_buttons(false);

  # --- Lighting Settings ---
  - platform: template
    name: "Link Panel & Underglow Brightness"
    id: switch_link_brightness
    device_id: dev_lighting
    icon: "mdi:link-variant"
    entity_category: config
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    turn_on_action:
      - lambda: id(clock_hub).set_link_brightness(true);
      - light.control:
          id: light_underglow
          state: !lambda 'return id(light_panel).current_values.is_on();'
          brightness: !lambda 'return id(light_panel).current_values.get_brightness();'
          transition_length: 0s
    turn_off_action:
      - lambda: id(clock_hub).set_link_brightness(false);

  # --- Alarm Settings ---
  - platform: template
    name: "Alarm Enabled"
    id: switch_alarm_enabled
    device_id: dev_alarm
    icon: "mdi:alarm-check"
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    turn_on_action:
      - lambda: id(clock_hub).arm_alarm();
    turn_off_action:
      - lambda: id(clock_hub).disarm_alarm();

  # --- Audio & Voice Settings ---
  - platform: template
    name: "Record Sound (Hold)"
    id: switch_record_sound
    device_id: dev_audio
    icon: "mdi:microphone"
    optimistic: true
    turn_on_action:
      - lambda: id(clock_hub).set_record_sound(true);
    turn_off_action:
      - lambda: id(clock_hub).set_record_sound(false);

select:
  # --- Clock & Display Selects ---
  - platform: template
    name: "Display Mode"
    id: select_display_mode
    device_id: dev_clock
    icon: "mdi:monitor"
    optimistic: true
    restore_value: true
    initial_option: "Time"
    options:
      - "Time"
      - "Timer"
      - "Alarm View"
      - "Slot Machine"
      - "Faces"
      - "Custom Text"
      - "Off"
    set_action:
      - lambda: |-
          if (x == "Time") id(clock_hub).set_display_mode(esphome::hack_pack_nixie_clock::MODE_TIME);
          else if (x == "Timer") id(clock_hub).set_display_mode(esphome::hack_pack_nixie_clock::MODE_TIMER);
          else if (x == "Alarm View") id(clock_hub).set_display_mode(esphome::hack_pack_nixie_clock::MODE_ALARM);
          else if (x == "Slot Machine") id(clock_hub).trigger_slot_machine(2500);
          else if (x == "Faces") id(clock_hub).trigger_face_animation();
          else if (x == "Custom Text") id(clock_hub).set_display_mode(esphome::hack_pack_nixie_clock::MODE_CUSTOM_TEXT);
          else if (x == "Off") id(clock_hub).set_display_mode(esphome::hack_pack_nixie_clock::MODE_OFF);

  - platform: template
    name: "Colon Color Mode"
    id: select_colon_mode
    device_id: dev_clock
    entity_category: config
    icon: "mdi:circle-half-full"
    optimistic: true
    restore_value: true
    initial_option: "Auto Blend"
    options:
      - "Auto Blend"
      - "Match Underglow"
      - "Fixed"
    set_action:
      - lambda: |-
          if (x == "Auto Blend") id(clock_hub).set_colon_mode(esphome::hack_pack_nixie_clock::COLON_AUTO_BLEND);
          else if (x == "Match Underglow") id(clock_hub).set_colon_mode(esphome::hack_pack_nixie_clock::COLON_MATCH_UNDERGLOW);
          else if (x == "Fixed") id(clock_hub).set_colon_mode(esphome::hack_pack_nixie_clock::COLON_FIXED);

button:
  # --- Countdown Timer Buttons ---
  - platform: template
    name: "Start Countdown Timer"
    id: button_start_timer
    device_id: dev_timer
    icon: "mdi:timer-play-outline"
    on_press:
      - lambda: |-
          id(clock_hub).start_timer();
          id(select_display_mode).publish_state("Timer");

  - platform: template
    name: "Stop Countdown Timer"
    id: button_stop_timer
    device_id: dev_timer
    icon: "mdi:timer-stop-outline"
    on_press:
      - lambda: |-
          id(clock_hub).stop_timer();
          id(select_display_mode).publish_state("Time");

  # --- Alarm Buttons ---
  - platform: template
    name: "Stop Ringing Alarm"
    id: button_stop_alarm
    device_id: dev_alarm
    icon: "mdi:alarm-snooze"
    on_press:
      - lambda: id(clock_hub).stop_alarm();

  # --- Clock & Animations Buttons ---
  - platform: template
    name: "Trigger Face Animation"
    id: button_trigger_face
    device_id: dev_clock
    icon: "mdi:emoticon-wink-outline"
    on_press:
      - lambda: id(clock_hub).trigger_face_animation();

  - platform: template
    name: "Cathode Cleaning (Slot Machine)"
    id: button_trigger_slot_machine
    device_id: dev_clock
    icon: "mdi:slot-machine"
    on_press:
      - lambda: id(clock_hub).trigger_slot_machine(2500);

  # --- Audio & Voice Buttons ---
  - platform: template
    name: "Play Audio Recording"
    id: button_play_sound
    device_id: dev_audio
    icon: "mdi:volume-high"
    on_press:
      - lambda: id(clock_hub).play_beep(150);

sensor:
  # --- Countdown Timer Sensor ---
  - platform: template
    name: "Timer Remaining Seconds"
    id: sensor_timer_remaining_sec
    device_id: dev_timer
    icon: "mdi:timer-outline"
    entity_category: diagnostic
    unit_of_measurement: "s"
    accuracy_decimals: 0
    lambda: |-
      return id(clock_hub).get_timer_remaining_sec();

text_sensor:
  # --- Countdown Timer Text Sensor ---
  - platform: template
    name: "Timer Remaining"
    id: text_sensor_timer_formatted
    device_id: dev_timer
    icon: "mdi:timer-sand-full"
    lambda: |-
      char buf[16];
      uint32_t s = id(clock_hub).get_timer_remaining_sec();
      snprintf(buf, sizeof(buf), "%02lu:%02lu:%02lu", (unsigned long)(s / 3600), (unsigned long)((s % 3600) / 60), (unsigned long)(s % 60));
      return std::string(buf);

  # --- Clock & Display Diagnostic Sensor ---
  - platform: template
    name: "Active Display Characters"
    id: text_sensor_display_chars
    device_id: dev_clock
    icon: "mdi:format-text"
    entity_category: diagnostic
    lambda: |-
      return std::string(id(clock_hub).get_current_display_text());

binary_sensor:
  # --- Alarm Status Sensor ---
  - platform: template
    name: "Alarm Ringing"
    id: bs_alarm_ringing
    device_id: dev_alarm
    icon: "mdi:alarm-bell"
    lambda: |-
      return id(clock_hub).is_alarm_ringing();

  # --- Countdown Timer Status Sensors ---
  - platform: template
    name: "Timer Running"
    id: bs_timer_running
    device_id: dev_timer
    icon: "mdi:timer-outline"
    lambda: |-
      return id(clock_hub).is_timer_running();

  - platform: template
    name: "Timer Ringing"
    id: bs_timer_ringing
    device_id: dev_timer
    icon: "mdi:bell-ring-outline"
    lambda: |-
      return id(clock_hub).is_timer_ringing();
