# ==============================================================================
# ESPHome Package for Hack Pack Nixie Clock (Box 15)
# Use this package to set up the entire clock with a single include!
# ==============================================================================

esphome:
  name: hack-pack-nixie-clock
  friendly_name: Hack Pack Nixie Clock
  devices:
    - name: "Clock & Display"
      id: dev_clock
    - name: "Lighting"
      id: dev_lighting
    - name: "Alarm Clock"
      id: dev_alarm
    - name: "Countdown Timer"
      id: dev_timer
    - name: "Audio & Voice"
      id: dev_audio

esp32:
  variant: esp32c3
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP_BROWNOUT_DET_LVL_SEL_0: y

logger:
  level: INFO

api:
  actions:
    - action: display_text
      variables:
        message: string
        scroll_speed_ms: int
      then:
        - hack_pack_nixie_clock.display_text:
            message: !lambda "return message;"
            scroll_speed_ms: !lambda "return (scroll_speed_ms > 0) ? (uint32_t)scroll_speed_ms : 350;"

    - action: trigger_face_animation
      then:
        - hack_pack_nixie_clock.trigger_face_animation:

    - action: trigger_slot_machine
      variables:
        duration_ms: int
      then:
        - hack_pack_nixie_clock.trigger_slot_machine:
            duration_ms: !lambda "return (duration_ms > 0) ? (uint32_t)duration_ms : 2500;"

    - action: play_sound
      then:
        - hack_pack_nixie_clock.play_sound:

    - action: start_timer
      variables:
        duration: string
      then:
        - hack_pack_nixie_clock.start_timer:
            duration: !lambda "return duration;"

    - action: show_time
      then:
        - hack_pack_nixie_clock.show_time:

    - action: show_timer
      then:
        - hack_pack_nixie_clock.show_timer:

ota:
  - platform: esphome
    on_begin:
      then:
        - hack_pack_nixie_clock.set_display_mode:
            mode: "OFF"
        - lambda: |-
            id(clock_hub).set_ready_for_ota();
    on_end:
      then:
        - lambda: |-
            id(clock_hub).set_ready_for_ota();

time:
  - platform: homeassistant
    id: homeassistant_time

hack_pack_nixie_clock:
  id: clock_hub
  time_id: homeassistant_time

light:
  - platform: hack_pack_nixie_clock
    type: panel
    name: "Nixie Tube Lighting"
    id: light_panel
    device_id: dev_lighting
    icon: "mdi:led-strip"
    restore_mode: RESTORE_DEFAULT_ON

  - platform: hack_pack_nixie_clock
    type: underglow
    name: "Underglow Lighting"
    id: light_underglow
    device_id: dev_lighting
    icon: "mdi:wall-sconce-flat"
    restore_mode: RESTORE_DEFAULT_ON

datetime:
  - platform: hack_pack_nixie_clock
    alarm_time:
      name: "Alarm Time"
      device_id: dev_alarm

text:
  - platform: hack_pack_nixie_clock
    timer_duration:
      name: "Timer Duration"
      device_id: dev_timer

switch:
  - platform: hack_pack_nixie_clock
    format_24hr:
      name: "24-Hour Format"
      device_id: dev_clock
    leading_zero:
      name: "Leading Zero"
      device_id: dev_clock
    colon_blinking:
      name: "Colon Blinking"
      device_id: dev_clock
    am_pm_indicators:
      name: "AM⁄PM Indicators"
      device_id: dev_clock
    periodic_faces:
      name: "Periodic Face Animations"
      device_id: dev_clock
    physical_buttons:
      name: "Physical Buttons Enabled"
      device_id: dev_clock
    link_brightness:
      name: "Link Panel & Underglow Brightness"
      device_id: dev_lighting
    alarm_enabled:
      name: "Alarm Enabled"
      device_id: dev_alarm
    record_sound:
      name: "Record Sound (Hold)"
      device_id: dev_audio
    timer_running:
      name: "Timer Running"
      device_id: dev_timer

select:
  - platform: hack_pack_nixie_clock
    colon_color_mode:
      name: "Colon Color Mode"
      device_id: dev_clock
      entity_category: config

button:
  - platform: hack_pack_nixie_clock
    reset_timer:
      name: "Reset Countdown Timer"
      device_id: dev_timer
    stop_alarm:
      name: "Stop Ringing Alarm"
      device_id: dev_alarm
    trigger_face:
      name: "Trigger Face Animation"
      device_id: dev_clock
    trigger_slot_machine:
      name: "Cathode Cleaning (Slot Machine)"
      device_id: dev_clock
    play_sound:
      name: "Play Audio Recording"
      device_id: dev_audio

text_sensor:
  - platform: hack_pack_nixie_clock
    timer_remaining:
      name: "Timer Remaining"
      device_id: dev_timer
    version:
      name: "Integration Version"
      device_id: dev_clock

binary_sensor:
  - platform: hack_pack_nixie_clock
    alarm_ringing:
      name: "Alarm Ringing"
      device_id: dev_alarm
    timer_ringing:
      name: "Timer Ringing"
      device_id: dev_timer
